name: Build release firmware

on:
  push:
    tags:
      - "*"
  workflow_dispatch:

jobs:
  build-release:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.9"

      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: ${{ runner.os }}-platformio-${{ hashFiles('platformio.ini') }}
          restore-keys: |
            ${{ runner.os }}-platformio-

      - name: Install PlatformIO
        run: python -m pip install --upgrade platformio

      - name: Build release firmware
        run: |
          pio run -e FuelStationHardware_RELEASE
          pio run -e FuelStationHardware_RELEASE --target buildfs

      - name: Collect build artifacts
        shell: bash
        run: |
          mkdir -p artifacts
          cp .pio/build/FuelStationHardware_RELEASE/GA_FUEL_TERMINAL*.bin artifacts/
          cp .pio/build/FuelStationHardware_RELEASE/littlefs.bin artifacts/

      - name: Upload firmware artifacts
        uses: actions/upload-artifact@v4
        with:
          name: firmware-release-${{ github.ref_name }}
          path: artifacts/
          if-no-files-found: error
