image: python:3.9

cache:
  paths:
    - ~/.cache/pip
    - ~/.platformio/.cache

stages:
 - test
 - build
 - release

before_script:
  - "pip install -U platformio"

test:
  stage: test
  script: "pio run -e FuelStationHardware_DEBUG"

build:
  stage: build
  script: "pio run -e FuelStationHardware_RELEASE"

release:
  stage: release
  only: 
    - tags
