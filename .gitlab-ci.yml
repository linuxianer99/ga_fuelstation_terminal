image: python:3.9

cache:
  paths:
    - ~/.cache/pip
    - ~/.platformio/.cache

stages:
 - build_debug
 #- build
 #- release

before_script:
  - "pip install -U platformio"
  
build_debug:
  stage: build_debug
  script: 
    - "pio run -e FuelStationHardware_DEBUG -d $CI_PROJECT_DIR"
    - pwd
    - ls -al
    - mkdir -p builds
    - ls .pio/build/FuelStationHardware_DEBUG
    - cp .pio/build/FuelStationHardware_DEBUG/GA_FUEL_TERMINAL*.elf builds/
    - cp .pio/build/FuelStationHardware_DEBUG/GA_FUEL_TERMINAL*.bin builds/
  artifacts:
    paths:
    - builds/*


