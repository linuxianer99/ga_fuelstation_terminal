image: python:3.9

cache:
  paths:
    - ~/.cache/pip
    - ~/.platformio/.cache

stages:
 - test
 #- build
 #- release

before_script:
  - "pip install -U platformio"
  
test:
  stage: test
  script: "pio run -e FuelStationHardware_DEBUG -d $CI_PROJECT_DIR"
  #script: "pio ci -e FuelStationHardware_DEBUG --build-dir=\"$CI_PROJECT_DIR/tmp/build\" --keep-build-dir"
  artifacts:
    paths:
    - $CI_PROJECT_DIR/.pio/FuelStationHardware_DEBUG\GA_FUEL_TERMINAL*.elf
    - $CI_PROJECT_DIR/.pio/FuelStationHardware_DEBUG\GA_FUEL_TERMINAL*.bin

