; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env]
platform = 
	espressif32@^6.4.0
	#https://github.com/platformio/platform-espressif32.git
platform_packages = 
	platformio/framework-arduinoespressif32@^3.20014.231204
	#platformio/framework-arduinoespressif32 @ https://github.com/espressif/arduino-esp32.git#3.0.0-alpha3
	#platformio/framework-arduinoespressif32-libs @ https://github.com/espressif/esp32-arduino-libs.git#idf-release/v5.1
framework = arduino
lib_deps = 
	computer991/Arduino_MFRC522v2@^2.0.1
	Wire
	marcoschwartz/LiquidCrystal_I2C@^1.1.4
	intrbiz/Crypto@^1.0.0
	esphome/ESPAsyncWebServer-esphome @ ^3.1.0
	bblanchon/ArduinoJson @ ^7.0.4
	densaugeo/base64 @ ^1.4.0
	ayushsharma82/ElegantOTA@^3.1.1
	esphome/AsyncTCP-esphome@2.1.3

board_build.filesystem = littlefs
monitor_speed = 115200
extra_scripts = 
    pre:auto_firmware_version.py

[env:FuelStationHardware_DEBUG]
board = ga_fuel_station
debug_tool = esp-builtin
build_flags = -DCORE_DEBUG_LEVEL=5 -DTESTMODE -DDEBUGMODE -DELEGANTOTA_USE_ASYNC_WEBSERVER=1


[env:FuelStationHardware_RELEASE]
board = ga_fuel_station
debug_tool = esp-builtin
build_flags = -DCORE_DEBUG_LEVEL=3 -DELEGANTOTA_USE_ASYNC_WEBSERVER=1

